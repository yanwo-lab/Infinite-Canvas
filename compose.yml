services:
  infinite-canvas:
    build:
      context: .
    restart: unless-stopped
    init: true
    ports:
      - "${CANVAS_HOST_PORT:-3000}:3000"
    environment:
      CANVAS_DATA_DIR: /data/app
      CANVAS_UPLOADS_DIR: /data/uploads
      CANVAS_CACHE_DIR: /data/cache
      CANVAS_OUTPUT_DIR: /data/output
    volumes:
      - "${CANVAS_HOST_DATA_DIR:-./docker-data/data}:/data/app"
      - "${CANVAS_HOST_UPLOADS_DIR:-./docker-data/uploads}:/data/uploads"
      - "${CANVAS_HOST_CACHE_DIR:-./docker-data/cache}:/data/cache"
      - "${CANVAS_HOST_OUTPUT_DIR:-./docker-data/output}:/data/output"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1', 3000), 3); s.close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
